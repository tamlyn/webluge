name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          # CMake takes the version from the firmware's release tag, so the submodule needs its full history.
          fetch-depth: 0
      - uses: jdx/mise-action@v5
      - run: emcmake cmake -B build -G Ninja
      - run: ninja -C build webluge_web
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build -- --base=/${{ github.event.repository.name }}/
        working-directory: web
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
